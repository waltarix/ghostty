name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+-custom
      - v[0-9]+.[0-9]+.[0-9]+-custom-r[0-9]+

jobs:
  build:
    runs-on: macos-26
    env:
      xcode_version: "26.2"
      zig_version: 0.15.2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install zig
        run: |
          mkdir -p opt/zig
          cd opt
          curl -L 'https://ziglang.org/download/${{ env.zig_version }}/zig-aarch64-macos-${{ env.zig_version }}.tar.xz' \
            | tar -Jxf - --strip-components=1 -C zig
          echo "$(pwd)/zig" >> $GITHUB_PATH

      - name: Setup Xcode
        run: sudo xcode-select -s '/Applications/Xcode_${{ env.xcode_version }}.app/Contents/Developer'

      - name: Install MetalToolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-custom*}"
          zig build -Doptimize=ReleaseFast -Dversion-string="$version"

      - name: Archive
        run: tar -C zig-out -Jcvf Ghostty.tar.xz Ghostty.app

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.xz"
          allowUpdates: true
